<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="../../styles/auth/login.css">
</head>

<body data-page="login">
  <div class="box">
    <div class="container">
      <div class="one">
        <div class="plus">
          <img src="../../assets/auth/login/pharma_sense_login_assets/icons/pharma-sense-logo.svg"
            alt="Pharma Sense logo">
        </div>
        <div class="text">
          <h1>Pharma Sense</h1>
          <p>
            Pharmacy Management System
          </p>
        </div>
      </div>
      <div class="two">
        <div class="user">
          <img src="../../assets/auth/login/pharma_sense_login_assets/icons/user.svg" alt="">
        </div>
        <div class="welcomeback">
          <h1>Welcome Back</h1>
        </div>
        <div class="description">
          <p>Login to continue to Pharma Sense</p>
        </div>
      </div>
      <form action="" class="three">
        <div class="email form">
          <img src="../../assets/auth/login/pharma_sense_login_assets/icons/user - Copy.svg" alt="">
          <input type="email" name="email" id="email" autocomplete="email" required placeholder="Email">
        </div>
        <div class="password form">
          <img src="../../assets/auth/login/pharma_sense_login_assets/icons/lock.svg" alt="">
          <input type="password" name="password" id="password" required placeholder="Password">
          <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password"><img
              src="../../assets/auth/login/pharma_sense_login_assets/icons/eye.svg" alt=""></button>

        </div>
        <div class="four ">
          <div>
            <input type="checkbox" name="Remember Me" id="Remember Me">
            <p>Remember Me</p>
          </div>
          <button type="button" class="forgot-password" data-open-recovery>Forgot Password?</button>
        </div>

        <p class="form-message" data-form-message role="alert" hidden></p>
        <button class="submit-button" type="submit">Login to Dashboard</button>

      </form>

      <div class="already">
        <p>Don't have an account?</p>
        <a href="register.html">Register</a>
      </div>

    </div>

  </div>

  <div class="recovery-backdrop" data-recovery-modal hidden>
    <section class="recovery-modal" role="dialog" aria-modal="true" aria-labelledby="recovery-title"
      aria-describedby="recovery-description">
      <button type="button" class="recovery-close" data-close-recovery aria-label="Close password recovery">×</button>
      <div class="recovery-icon" aria-hidden="true">✉</div>
      <h2 id="recovery-title">Reset your password</h2>
      <p id="recovery-description" data-recovery-copy>Enter your registered email to continue to the OTP step.</p>
      <form data-recovery-form novalidate>
        <label for="recovery-email" data-recovery-email-label>Registered email</label>
        <input id="recovery-email" name="recoveryEmail" type="email" autocomplete="email"
          placeholder="Enter your registered email" required />
        <label for="recovery-otp" data-recovery-otp-label hidden>Enter OTP</label>
        <input id="recovery-otp" name="recoveryOtp" type="text" inputmode="numeric" autocomplete="one-time-code"
          placeholder="Enter OTP" maxlength="6" hidden />
        <p class="recovery-message" data-recovery-message role="alert" hidden></p>
        <div class="recovery-actions">
          <button type="button" class="recovery-cancel" data-close-recovery>Cancel</button>
          <button type="submit" class="recovery-send" data-recovery-send>Send</button>
        </div>
      </form>
    </section>
  </div>




  <script src="../../scripts/auth.js"></script>
</body>

</html>
