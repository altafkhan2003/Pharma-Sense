<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register page</title>
  <link rel="stylesheet" href="../../styles/auth/register.css" />
</head>

<body data-page="register">
  <div class="container">
    <div class="title">
      <div class="plus">
        <img src="../../assets/auth/register/pharma_sense_assets(1)/logo.png" alt="" />
      </div>
      <div class="pharma">
        <h2>Pharma Sense</h2>
        <p>Pharmacy Management System</p>
      </div>
    </div>
    <!-- <div class="circle">
      <div class="one active">1</div>
      <div class="line"></div>
      <div class="two active">2</div>
    </div> -->
    <div class="account">
      <h1>Create Your Account</h1>
      <p>Let's get yout personal details first.</p>
    </div>
    <form class="register">
      <div class="Owner-name">
        <img src="../../assets/auth/register/pharma_sense_assets(1)/icons/user.svg" alt="" />

        <input type="text" name="fullName" autocomplete="name" placeholder="Owner Full Name" required />
      </div>
      <div class="email Owner-name">
        <img src="../../assets/auth/register/pharma_sense_assets(1)/icons/mail.svg" alt="" />
        <input type="email" name="email" id="email" autocomplete="email" placeholder="Email" required />
      </div>
      <div class="phone Owner-name">
        <div class="left">
          <img src="../../assets/auth/register/pharma_sense_assets(1)/icons/phone.svg" alt="" />
          <input type="tel" name="phone" autocomplete="tel" placeholder="Phone Number" required />
        </div>
        <div class="right">Optional</div>
      </div>
      <div class="password Owner-name phone">
        <div class="left">
          <img src="../../assets/auth/register/pharma_sense_assets(1)/icons/lock.svg" alt="" />
          <input type="password" name="password" id="password" autocomplete="new-password" placeholder="Password"
            required />
        </div>
        <div class="right">
          <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password"><img
              src="../../assets/auth/register/pharma_sense_assets(1)/icons/eye.svg" alt="" /></button>
        </div>
      </div>
      <div class="confirm Owner-name phone">
        <div class="left">
          <img src="../../assets/auth/register/pharma_sense_assets(1)/icons/lock.svg" alt="" />
          <input type="password" name="confirmPassword" id="confirmPassword" autocomplete="new-password"
            placeholder="Confirm Password" required />
        </div>
        <div class="right">
          <button type="button" class="password-toggle" data-toggle-password="confirmPassword"
            aria-label="Show password"><img src="../../assets/auth/register/pharma_sense_assets(1)/icons/eye.svg"
              alt="" /></button>
        </div>
      </div>
      <p class="form-message" data-form-message role="alert" hidden></p>
      <div class="button">
        <button type="submit">Create account</button>
      </div>
    </form>
    <div class="already">
      <p>Already have an account?</p>
      <a href="login.html">Login</a>
    </div>
  </div>
  <script src="../../scripts/auth.js"></script>
</body>

</html>
