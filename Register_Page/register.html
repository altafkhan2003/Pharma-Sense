<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register page</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <div class="container">
      <div class="title">
        <div class="plus">
          <img src="Assets/pharma_sense_assets(1)/logo.png" alt="" />
        </div>
        <div class="pharma">
          <h2>Pharma Sense</h2>
          <p>Pharmacy Management System</p>
        </div>
      </div>
      <div class="circle">
        <div class="one active">1</div>
        <div class="line"></div>
        <div class="two active">2</div>
      </div>
      <div class="account">
        <h1>Create Your Account</h1>
        <p>Let's get yout personal details first.</p>
      </div>
      <form action="" class="register">
        <div class="Owner-name">
          <img src="Assets/pharma_sense_assets(1)/icons/user.svg" alt="" />

          <input type="text" placeholder="Owner Full Name" required />
        </div>
        <div class="email Owner-name">
          <img src="Assets/pharma_sense_assets(1)/icons/mail.svg" alt="" />
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Email"
            required
          />
        </div>
        <div class="phone Owner-name">
          <div class="left">
            <img src="Assets/pharma_sense_assets(1)/icons/phone.svg" alt="" />
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Phone Number"
              required
            />
          </div>
          <div class="right">Optional</div>
        </div>
        <div class="password Owner-name phone">
          <div class="left">
            <img src="Assets/pharma_sense_assets(1)/icons/lock.svg" alt="" />
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Password"
              required
            />
          </div>
          <div class="right">
            <img src="Assets/pharma_sense_assets(1)/icons/eye.svg" alt="" />
          </div>
        </div>
        <div class="confirm Owner-name phone">
          <div class="left">
            <img src="Assets/pharma_sense_assets(1)/icons/lock.svg" alt="" />
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Confirm Password"
              required
            />
          </div>
          <div class="right">
            <img src="Assets/pharma_sense_assets(1)/icons/eye.svg" alt="" />
          </div>
        </div>
      </form>
      <div class="button">
        <button>Next</button>
      </div>
      <div class="already">
        <p>Already have an account?</p>
        <a href="../login_Page/login.html">Login</a>
      </div>
    </div>
    <div class="username"></div>
    </li></ul>
  </body>
</html>
