<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="box">
        <div class="container">
            <div class="one">
                <div class="plus">
                    <img src="Assets/pharma_sense_login_assets/icons/pharma-sense-logo.svg">
                </div>
                <div class="text">
                    <h1>Pharma Sense</h1>
                    <p>
                        Pharmacy Management System
                    </p>
                </div>
            </div>
            <div class="two">
                <div class="user">
                    <img src="Assets/pharma_sense_login_assets/icons/user.svg" alt="">
                </div>
                <div class="welcomeback">
                    <h1>Welcome Back</h1>
                </div>
                <div class="description">
                    <p>Login to continue to Pharma Sense</p>
                </div>
            </div>
            <form action="" class="three">
                <div class="email form">
                    <img src="Assets/pharma_sense_login_assets/icons/user - Copy.svg" alt="">
                    <input type="email" name="email" id="email" required placeholder="Email or Username">
                </div>
                <div class="password form">
                    <img src="Assets/pharma_sense_login_assets/icons/lock.svg" alt="">
                     <input type="password" name="password" id="password" required placeholder="Password">
                     <img src="Assets/pharma_sense_login_assets/icons/eye.svg" alt="" id="eye">

                </div>
                <div class="four ">
                   <div>
                     <input type="checkbox" name="Remember Me" id="Remember Me">
                    <p>Remember Me</p>
                   </div>
                    <a href="#">Forget Password?</a>
                </div>


            </form>
           

            </div>

        </div>
        

  

    
</body>
</html>
